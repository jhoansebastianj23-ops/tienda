spring:
  application:
    name: tienda
  datasource:
    url: jdbc:mysql://localhost:3306/tienda_db
    username: tienda
    password: Tienda1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
server:
  port: 9090
  servlet:
    context-path: /api/v1/tienda # Ruta de contexto de todo el proyecto
security:
  jwt:
    secret-key: ${env.jwt.secret-key} # Genera con openssl rand -base64 32
    token-expiration: ${env.jwt.token-expiration} # 10 min expresado en milisegundos (600000)
